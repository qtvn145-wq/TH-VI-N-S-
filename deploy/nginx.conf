server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 6m;
    location = / { try_files /index.html =404; }
    location /ui/ { try_files $uri =404; }
    location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /media/ { proxy_pass http://backend:8000; }
    location = /docs { proxy_pass http://backend:8000; }
    location = /openapi.json { proxy_pass http://backend:8000; }
    location / { return 404; }
}
