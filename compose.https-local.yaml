services:
  local-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8443:443"]
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - local_caddy_data:/data
      - local_caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  local_caddy_data:
  local_caddy_config:
