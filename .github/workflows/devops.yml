name: Test build and optional deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy tested images to configured server
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: library-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: PYTHONPATH=. python qa/integration_test.py
      - run: node qa/api_client_test.mjs
      - run: bash scripts/setup.sh
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait
      - run: bash scripts/smoke.sh
      - run: bash scripts/ops.sh backup
      - name: Package tested images and source
        run: |
          docker save thu-vien-api:local thu-vien-web:local | gzip > /tmp/images.tar.gz
          git archive HEAD -o /tmp/source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: tested-release
          path: |
            /tmp/images.tar.gz
            /tmp/source.tar
          retention-days: 14
      - if: always()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: verify
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-release
          path: release
      - name: Install SSH identity
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/*
      - name: Transfer and deploy tested release
        env:
          TARGET: ${{ secrets.DEPLOY_TARGET }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          ssh "$TARGET" 'mkdir -p /opt/thu-vien-incoming'
          scp release/* "$TARGET:/opt/thu-vien-incoming/"
          ssh "$TARGET" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/thu-vien-so
          # Host must be provisioned first; keep its .env and secrets.
          test -f .env
          exec 9>.ops.lock
          flock -w 300 9
          docker compose stop backend
          docker compose run --rm --no-deps maintenance
          tar -xf /opt/thu-vien-incoming/source.tar
          docker load -i /opt/thu-vien-incoming/images.tar.gz
          # CI image names are :local; host IMAGE_TAG must be local.
          export IMAGE_TAG=local
          docker compose run --rm --no-deps migrate
          docker compose up -d --no-build --wait
          docker compose exec -T proxy caddy reload --config /etc/caddy/Caddyfile
          REMOTE
          curl --fail --silent --show-error --max-time 30 "$PUBLIC_URL/api/v1/health"
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
